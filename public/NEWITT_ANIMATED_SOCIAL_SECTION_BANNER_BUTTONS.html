<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NEWITT Media Socials</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020305;
    font-family:
        Inter,
        "Avenir Next",
        Avenir,
        Arial,
        sans-serif;
}

.social{
    width:100%;
    height:100%;
    min-height:420px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    position:relative;
    overflow:hidden;
    text-align:center;
    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(0,174,255,.10),
            transparent 35%
        ),
        radial-gradient(
            circle at 50% 75%,
            rgba(201,164,91,.06),
            transparent 40%
        ),
        #020305;
}

.social::before{
    content:"";
    position:absolute;
    inset:-50%;
    background:
        linear-gradient(
            115deg,
            transparent 45%,
            rgba(120,220,255,.08) 50%,
            transparent 55%
        );
    animation:sweep 7s linear infinite;
}

.content{
    position:relative;
    z-index:2;
    width:min(1050px,100%);
}

.eyebrow{
    color:#c9a45b;
    font-size:.68rem;
    font-weight:800;
    letter-spacing:.22em;
    text-transform:uppercase;
    margin-bottom:12px;
}

h1{
    margin:0;
    color:#fff;
    font-size:clamp(2rem,5vw,4rem);
    line-height:1;
    letter-spacing:-.03em;
}

h1 span{
    color:#c9a45b;
}

.line{
    width:80px;
    height:1px;
    margin:20px auto;
    background:rgba(201,164,91,.7);
}

.intro{
    margin:0 auto 30px;
    max-width:620px;
    color:rgba(255,255,255,.68);
    font-size:.9rem;
    line-height:1.7;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
}

.button{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:120px;
    min-height:42px;
    padding:10px 16px;
    border:1px solid rgba(255,255,255,.16);
    border-radius:7px;
    color:#fff;
    background:rgba(255,255,255,.045);
    font-size:.7rem;
    font-weight:750;
    letter-spacing:.06em;
    text-decoration:none;
    transition:.2s ease;
}

.button:hover{
    transform:translateY(-3px);
    background:rgba(255,255,255,.10);
}

.skyline{
    border-color:rgba(78,207,255,.35);
}

.skyline:hover{
    border-color:#4ecfff;
    box-shadow:0 10px 35px rgba(0,174,255,.12);
}

.paranormal{
    border-color:rgba(255,72,82,.30);
}

.paranormal:hover{
    border-color:#ff5d67;
    box-shadow:0 10px 35px rgba(220,45,55,.12);
}

.gold{
    border-color:rgba(201,164,91,.35);
}

.gold:hover{
    border-color:#c9a45b;
    box-shadow:0 10px 35px rgba(201,164,91,.12);
}

.footer{
    margin-top:28px;
    color:rgba(255,255,255,.38);
    font-size:.58rem;
    font-weight:700;
    letter-spacing:.14em;
}

@keyframes sweep{
    from{transform:translateX(-20%) rotate(0deg)}
    to{transform:translateX(20%) rotate(0deg)}
}

@media(max-width:600px){
    .social{
        min-height:500px;
        padding:35px 14px;
    }

    .buttons{
        gap:8px;
    }

    .button{
        min-width:105px;
        padding:9px 11px;
        font-size:.62rem;
    }
}

@media(prefers-reduced-motion:reduce){
    *{
        animation:none!important;
        transition:none!important;
    }
}
</style>
</head>

<body>

<section class="social">

<div class="content">

<div class="eyebrow">
NEWITT MEDIA
</div>

<h1>
Follow the <span>Adventure.</span>
</h1>

<div class="line"></div>

<p class="intro">
Follow NEWITT Media across the three worlds:
from above, after dark, and everything in between.
</p>

<div class="buttons">

<a class="button skyline"
href="https://www.tiktok.com/@newittskylinemedia"
target="_blank"
rel="noopener noreferrer">
♪ Skyline TikTok
</a>

<a class="button skyline"
href="https://www.youtube.com/@Newitt-skyline-media"
target="_blank"
rel="noopener noreferrer">
▶ Skyline YouTube
</a>

<a class="button paranormal"
href="https://www.tiktok.com/@nw13ttt"
target="_blank"
rel="noopener noreferrer">
♪ Paranormal TikTok
</a>

<a class="button paranormal"
href="https://www.youtube.com/@NewittsParanormalAdventures"
target="_blank"
rel="noopener noreferrer">
▶ Paranormal YouTube
</a>

<a class="button paranormal"
href="https://www.instagram.com/nw13ttt/"
target="_blank"
rel="noopener noreferrer">
◎ Instagram
</a>

<a class="button paranormal"
href="https://www.facebook.com/share/1AiSkdbyM4/"
target="_blank"
rel="noopener noreferrer">
f Facebook
</a>

</div>

<div class="footer">
FROM ABOVE. AFTER DARK. AND EVERYTHING IN BETWEEN.
</div>

</div>

</section>

</body>
</html>
